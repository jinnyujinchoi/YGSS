openai:
  api_key_env: OPENAI_API_KEY
  base_url_env: ""          # Colab: 비워두면 표준 OpenAI endpoint 사용. GMS 프록시 쓸 때만 채울 것
  embedding_model: text-embedding-3-small

embedding:
  provider: openai
  dimension: 1536

models:
  cross_encoders:
    candidates:
      - name: production_baseline
        hf_id: cross-encoder/ms-marco-MiniLM-L-12-v2
        language: en
      - name: dragonkue_bge_m3_ko
        hf_id: dragonkue/bge-reranker-v2-m3-ko
        language: ko
      - name: ko_reranker
        hf_id: Dongjin-kr/ko-reranker
        language: ko
      - name: bge_m3
        hf_id: BAAI/bge-reranker-v2-m3
        language: multi

retrieval:
  thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  bi_top_k: 10
  cross_encoder_threshold: 6.0
  cross_top_n: 3
  metric_cutoffs: [1, 3, 5]

data:
  eval_set_path: dataset/eval_set.json
  chat_dummy_sql_path: ../../../exec/basic_insert.sql
  source_mode: sql_dump
  embedding_dump_path: dataset/embedding_dump.jsonl

redis:
  scan_count: 200
  max_keys: 50000
  timeout_seconds: 20
  key_pattern: "*"

results:
  output_dir: results
  baseline_json: baseline_threshold_sweep.json
  baseline_png: baseline_threshold_sweep.png
  tmp_prefix: tmp_
  raw_prefix: raw_
