openai:
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  embedding_model: text-embedding-3-small

embedding:
  provider: openai
  dimension: 1536

models:
  production_cross_encoder: cross-encoder/ms-marco-MiniLM-L-12-v2
  korean_cross_encoder: Dongjin-kr/ko-reranker
  scorer_mode: sentence-transformers
  cross_encoders:
    selected_alias: ko_reranker
    candidates:
      - name: ko_reranker
        model_name: Dongjin-kr/ko-reranker
  selected:
    name: ko_reranker
    hf_id: Dongjin-kr/ko-reranker
    best_f1_cutoff: 0.516129
    source: results/cross_encoder_comparison_20260502_113638.json

retrieval:
  thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  bi_top_k: 10
  cross_encoder_threshold: 0.516129
  cross_top_n: 3
  metric_cutoffs: [1, 3, 5]

grid_search:
  bi_threshold: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  bi_top_k: [5, 10, 15, 20]
  cross_threshold: [0.41, 0.46, 0.51, 0.56, 0.61]
  cross_top_n: [1, 3, 5]

data:
  eval_set_path: dataset/eval_set.json
  chat_dummy_sql_path: ../../../exec/basic_insert.sql
  source_mode: sql_dump
  embedding_dump_path: dataset/embedding_dump.jsonl

redis:
  scan_count: 200
  max_keys: 50000
  timeout_seconds: 20
  key_pattern: "*"

results:
  output_dir: results
  baseline_json: baseline_threshold_sweep.json
  baseline_png: baseline_threshold_sweep.png
  tmp_prefix: tmp_
  raw_prefix: raw_
